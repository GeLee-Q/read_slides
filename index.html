<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>read_slides — GeLee-Q</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:        #fdf7f0;
    --bg-1:      #ffffff;
    --bg-2:      #fff3e7;
    --ink:       #1e1a24;
    --ink-dim:   #4a4450;
    --ink-mute:  #8a8394;
    --pink:    #ff85b5;
    --green:   #7bd88f;
    --yellow:  #ffd85c;
    --lilac:   #c6a7ff;
    --peach:   #ffa87a;
    --sans:  'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --serif: 'Instrument Serif', ui-serif, Georgia, serif;
    --mono:  ui-monospace, 'SF Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #e9dfcf 1px, transparent 1.3px);
    background-size: 22px 22px;
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%);
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 10% 6%, #ff85b533, transparent 38%),
      radial-gradient(circle at 92% 12%, #7bd88f33, transparent 40%),
      radial-gradient(circle at 70% 92%, #ffd85c30, transparent 42%);
    pointer-events: none;
    z-index: 0;
  }
  .stage { position: relative; z-index: 1; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 32px; }

  /* nav */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in oklab, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    border-bottom: 1.5px solid var(--ink);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  .brand-blob {
    width: 22px; height: 22px;
    background: var(--pink);
    border-radius: 50% 60% 55% 45% / 55% 45% 60% 50%;
    position: relative;
    animation: blob 8s ease-in-out infinite;
    border: 1.5px solid var(--ink);
  }
  .brand-blob::after { content: ""; position: absolute; top: 5px; left: 6px; width: 5px; height: 5px; background: var(--ink); border-radius: 50%; }
  @keyframes blob {
    0%,100% { border-radius: 50% 60% 55% 45% / 55% 45% 60% 50%; transform: rotate(0); }
    33%     { border-radius: 60% 40% 45% 60% / 45% 60% 40% 55%; transform: rotate(6deg); }
    66%     { border-radius: 45% 55% 60% 40% / 60% 50% 45% 55%; transform: rotate(-4deg); }
  }
  .brand b { font-weight: 600; color: var(--ink); }
  .brand span { color: var(--ink-mute); }
  .nav-links { display: flex; align-items: center; gap: 22px; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .nav-links a { transition: color .15s; }
  .nav-links a:hover { color: var(--pink); }
  .star-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    background: var(--yellow); color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 999px;
    font-weight: 600; box-shadow: 2px 2px 0 var(--ink);
    transition: transform .15s, box-shadow .15s;
  }
  .star-btn:hover { color: var(--ink); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
  .star-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  /* hero */
  .hero { padding: 96px 0 56px; position: relative; }
  .sticker {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 12px;
    background: var(--yellow); color: var(--ink);
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    border-radius: 999px; transform: rotate(-2deg); margin-bottom: 28px;
    border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  .sticker::before { content: "✦"; font-size: 13px; }
  h1.title {
    font-weight: 500;
    font-size: clamp(56px, 11vw, 120px);
    line-height: 0.92; letter-spacing: -0.035em;
    margin: 0 0 32px; color: var(--ink); text-wrap: balance;
  }
  h1.title .serif { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  h1.title .amp   { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--ink-mute); }
  h1.title .sw-pink  { color: var(--pink);  }
  h1.title .sw-green { color: var(--green); }
  h1.title .sw-lilac { color: var(--lilac); }
  h1.title .sw-peach { color: var(--peach); }
  .lede { max-width: 520px; font-size: 18px; color: var(--ink-dim); line-height: 1.5; margin: 0; }
  .lede em { font-family: var(--serif); font-style: italic; font-weight: 400; color: var(--ink); font-size: 20px; }
  .doodle { position: absolute; pointer-events: none; }
  .doodle.star  { top: 50px; right: 8%; color: var(--pink);  animation: spin 14s linear infinite; }
  .doodle.squig { bottom: 6px; right: 16%; color: var(--green); animation: bob 5s ease-in-out infinite; }
  .doodle.plus  { top: 140px; right: 2%; color: var(--lilac); animation: bob 6.5s ease-in-out infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* section */
  .section-head { padding: 36px 0 22px; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .section-head h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 30px; margin: 0; }
  .section-head h2 .pin { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: var(--pink); margin-right: 12px; vertical-align: middle; border: 1.5px solid var(--ink); }
  .section-head .count { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }

  /* cards */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 80px; }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; gap: 18px; }
    .wrap { padding: 0 20px; }
    .hero { padding: 64px 0 36px; }
    .doodle.star, .doodle.plus { display: none; }
  }
  .card {
    position: relative; background: var(--bg-1); border: 1.5px solid var(--ink);
    border-radius: 18px; padding: 28px 26px 22px;
    display: flex; flex-direction: column; min-height: 240px; cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background .2s;
  }
  .card::before {
    content: ""; position: absolute; top: -10px; left: 26px;
    width: 50px; height: 18px; background: var(--card-color, var(--pink));
    border: 1.5px solid var(--ink); border-radius: 4px; transform: rotate(-3deg);
  }
  .card:nth-child(1) { --card-color: var(--pink);  }
  .card:nth-child(2) { --card-color: var(--green); }
  .card:nth-child(3) { --card-color: var(--lilac); }
  .card:nth-child(4) { --card-color: var(--peach); }
  .card:hover { transform: translate(-2px, -4px) rotate(-0.4deg); box-shadow: 7px 8px 0 var(--ink); background: var(--bg-2); }
  .card:hover .card-arrow { transform: translate(2px, -2px); }
  .card:hover::before { transform: rotate(-6deg) translateY(-1px); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; font-family: var(--mono); font-size: 11px; color: var(--ink-mute); margin-bottom: 18px; margin-top: 6px; }
  .card-index { letter-spacing: 0.05em; white-space: nowrap; }
  .card-arrow {
    width: 28px; height: 28px; background: var(--card-color, var(--pink));
    color: var(--ink); border: 1.5px solid var(--ink); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .card-arrow svg { width: 12px; height: 12px; }
  .card-title { font-weight: 600; font-size: 22px; letter-spacing: -0.015em; line-height: 1.22; margin: 0 0 10px; text-wrap: balance; }
  .card-desc { font-size: 14px; color: var(--ink-dim); line-height: 1.55; margin: 0 0 20px; text-wrap: pretty; flex: 1; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1.2px solid var(--ink); letter-spacing: 0.02em; }
  .tag[data-k="ai"]    { background: var(--green);  }
  .tag[data-k="sys"]   { background: var(--peach);  }
  .tag[data-k="paper"] { background: var(--lilac);  }
  .tag[data-k="rl"]    { background: var(--pink);   }
  .tag[data-k="note"]  { background: var(--yellow); }
  .card-date { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); white-space: nowrap; }
  .card.draft { cursor: default; background: transparent; border-style: dashed; box-shadow: none; }
  .card.draft::before { background: var(--bg); }
  .card.draft:hover { transform: none; box-shadow: none; background: transparent; }
  .card.draft:hover::before { transform: rotate(-3deg); }
  .card.draft .card-title, .card.draft .card-desc { color: var(--ink-mute); }
  .card.draft .card-arrow { background: var(--bg); color: var(--ink-mute); }

  /* footer */
  footer { border-top: 1.5px solid var(--ink); padding: 36px 0 52px; font-family: var(--mono); font-size: 12px; color: var(--ink-mute); }
  .foot-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .foot-row a { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); padding: 8px 14px; border: 1.5px solid var(--ink); background: var(--bg-1); border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); transition: all .15s; white-space: nowrap; }
  .foot-row a:hover { background: var(--pink); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .foot-row svg { width: 14px; height: 14px; }
  .foot-wave { font-family: var(--serif); font-style: italic; color: var(--ink-dim); font-size: 14px; }
</style>
</head>
<body>
<div class="stage">

<nav class="nav">
  <div class="wrap nav-inner">
    <a href="#" class="brand">
      <span class="brand-blob"></span>
      <b>read_slides</b>
      <span>·&nbsp;by GeLee-Q</span>
    </a>
    <div class="nav-links">
      <a href="#archive">archive</a>
      <a href="https://github.com/GeLee-Q" target="_blank" rel="noopener">github ↗</a>
      <a href="https://github.com/GeLee-Q/read_slides" target="_blank" rel="noopener" class="star-btn">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>
        Star
      </a>
    </div>
  </div>
</nav>

<header class="hero wrap">
  <svg class="doodle star" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 3v34M3 20h34M8 8l24 24M32 8L8 32"/>
  </svg>
  <svg class="doodle squig" width="64" height="22" viewBox="0 0 64 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <path d="M2 11 Q 11 2, 20 11 T 38 11 T 62 11"/>
  </svg>
  <svg class="doodle plus" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
    <path d="M14 3v22M3 14h22"/>
  </svg>
  <div class="sticker">reading · rewriting · thinking out loud</div>
  <h1 class="title">
    <span class="sw-pink">slides</span>,
    <span class="sw-green">systems</span>,<br>
    <span class="sw-lilac">RL</span> <span class="amp">&amp;</span>
    <span class="serif sw-peach">papers</span>.
  </h1>
  <p class="lede">
    用 Claude 把代码、论文、PR 蒸馏成<em>可以翻页的笔记</em>。
  </p>
</header>

<main class="wrap" id="archive">
  <div class="section-head">
    <h2><span class="pin"></span><span class="label">on the shelf</span></h2>
    <div class="count" id="count2"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap foot-row">
    <div class="foot-wave">made with ♡ &amp; static HTML · © 2026 GeLee-Q</div>
    <a href="https://github.com/GeLee-Q" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 005.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GeLee-Q
    </a>
  </div>
</footer>

</div>
<script src="cards.js"></script>
<script>
  const arrow = `<span class="card-arrow"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9L9 3M9 3H4M9 3v5"/></svg></span>`;
  const grid = document.getElementById('grid');
  const total = String(CARDS.length).padStart(2, '0');

  CARDS.forEach((e, i) => {
    const idx = String(i + 1).padStart(2, '0');
    const tags = e.tags.map(([k, l]) => `<span class="tag" data-k="${k}">${l}</span>`).join('');
    const tag = e.href ? 'a' : 'div';
    const attrs = e.href ? `href="${e.href}"` : '';
    grid.insertAdjacentHTML('beforeend', `
      <${tag} class="card${e.draft ? ' draft' : ''}" ${attrs}>
        <div class="card-top">
          <span class="card-index">${idx} / ${total}</span>
          ${e.href ? arrow : ''}
        </div>
        <h3 class="card-title">${e.title}</h3>
        <p class="card-desc">${e.desc}</p>
        <div class="card-foot">
          <div class="tags">${tags}</div>
          <span class="card-date">${e.date}</span>
        </div>
      </${tag}>`);
  });

  const published = CARDS.filter(e => !e.draft).length;
  document.getElementById('count2').textContent =
    `${String(published).padStart(2, '0')} published · ${CARDS.length - published} cooking`;
</script>
</body>
</html>
